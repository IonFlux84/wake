# The category "Termine" (events). Posts with "category: termine" get these
# fields in the editor and the template "post-event" on the website.
title:
  de: Termine
  en: Events
slug:
  de: termine
  en: events
description:
  de: Was wann und wo stattfindet.
  en: What happens when and where.
icon: calendar
template: event
url: '{category}/{slug}'
list: upcoming
date_field: start
fields:
  start:
    type: datetime
    label: { de: Beginn, en: Start }
    required: true
    translate: false
  end:
    type: datetime
    label: { de: Ende, en: End }
    translate: false
  all_day:
    type: toggle
    label: { de: Ganztägig, en: All day }
    translate: false
  repeat:
    type: select
    label: { de: Wiederholung, en: Repeats }
    translate: false
    options:
      weekly: { de: Jede Woche, en: Every week }
      biweekly: { de: Alle 2 Wochen, en: Every other week }
      monthly_date: { de: Jeden Monat am gleichen Tag, en: Every month on the same day }
      monthly_weekday: { de: Jeden Monat am gleichen Wochentag (z. B. 2. Dienstag), en: Every month on the same weekday (e.g. 2nd Tuesday) }
      yearly: { de: Jedes Jahr, en: Every year }
  repeat_until:
    type: date
    label: { de: Wiederholen bis, en: Repeat until }
    hint: { de: Leer lassen für ohne Ende., en: Leave empty to repeat without end. }
    translate: false
  repeat_except:
    type: textarea
    list: true
    label: { de: Fällt aus am, en: Skipped on }
    placeholder: { de: "ein Datum pro Zeile, z. B. 2026-12-24", en: "one date per line, e.g. 2026-12-24" }
    translate: false
  location:
    type: text
    label: { de: Ort, en: Venue }
    placeholder: { de: z. B. Gemeindehaus, en: e.g. Town hall }
  address:
    type: text
    label: { de: Adresse, en: Address }
    hint: { de: Für den Kartenlink., en: Used for the map link. }
    translate: false
  online_url:
    type: url
    label: { de: Online-Teilnahme, en: Join online }
    translate: false
  organizer:
    type: text
    label: { de: Veranstalter, en: Organizer }
  price:
    type: text
    label: { de: Eintritt, en: Admission }
    placeholder: { de: z. B. frei oder 5 €, en: e.g. free or €5 }
  registration_url:
    type: url
    label: { de: Anmeldung (Link), en: Registration (link) }
    translate: false
  registration_deadline:
    type: date
    label: { de: Anmeldeschluss, en: Registration deadline }
    translate: false
  contact:
    type: text
    label: { de: Kontakt, en: Contact }
    placeholder: { de: E-Mail oder Telefon, en: Email or phone }
    translate: false
  event_status:
    type: select
    label: { de: Status, en: Status }
    translate: false
    options:
      scheduled: { de: Findet statt, en: Takes place }
      cancelled: { de: Abgesagt, en: Cancelled }
      postponed: { de: Verschoben, en: Postponed }
      soldout: { de: Ausgebucht, en: Sold out }
